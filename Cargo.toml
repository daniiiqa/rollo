[package]
name = "rollo"
version = "0.1.0"
edition = "2024"
description = "La vista de workspaces de discada: los 10 en miniatura, con sus ventanas de verdad"
license = "MIT"

[dependencies]
disco = { git = "https://github.com/daniiiqa/disco", features = ["paint"] }
libc = "0.2"
ratatui = "0.29"
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = "0.12.0"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
